services:
  - type: web
    name: clusterguard-studio
    runtime: python
    plan: free
    buildCommand: "python --version"
    startCommand: "python -m clusterguard.server"
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LLM_LIVE_ENABLED
        value: "1"
      - key: MAX_LIVE_PLANS
        value: "50"
