services:
  - type: web
    name: clusterguard-studio
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: LLM_LIVE_ENABLED
        value: "1"
      - key: MAX_LIVE_PLANS
        value: "50"
